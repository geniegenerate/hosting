<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GenieGenerate — ชุมชนร้านค้าและกระเป๋าเงินดิจิทัลของคุณ. Your shops &amp; digital wallet community.">
    <meta name="theme-color" content="#FEFEFE" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#21262F" media="(prefers-color-scheme: dark)">
    <title>GenieGenerate</title>
    <!--
        Universal-link fallback landing page for link/staginglink/devlink
        .geniegenerate.com. Every path rewrites here (see _redirects).

        Why it exists: in-app browsers (LINE, Messenger, Instagram) load
        tapped links in their own webview and NEVER trigger iOS Universal
        Links / Android App Links. This page is what those users see, so it
        re-launches the app through the custom scheme
        (com.geniegenerate.mobile://...), which webviews DO hand off to the
        OS. The scheme URL is minted from the current path with one rule —
        strip the leading slash — which yields the host-form the app parses
        for enum routes (verify-email, reset-password, login) and the
        authority-folded form ShopShareLink / SlipVerificationLink accept
        for /shop/<uuid> and /v/<token>.

        Design tokens mirror business/FRONTEND_DESIGN_SYSTEM.md (mobile-app
        repo): 6-level grayscale + single member-mode accent (#F6921A),
        radius md=12px, onPrimary-on-orange is always ink (#21262F). The
        mark is the official logo (images/logo.png, transparent RGBA —
        served directly; static assets win over the /* SPA rewrite). Per
        the Wordmark & Name Standard (BRAND_FRAMEWORK.md §9 / design
        system §4.9) the wordmark is one mode-neutral color; brand color
        lives on the icon mark only.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&amp;family=Inter:wght@400;600&amp;display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        :root {
            /* Single accent — member-mode orange family */
            --brand: #F6921A;
            --brand-press: #EB850A;
            --brand-link: #D37708;
            --on-brand: #21262F;
            /* Monochrome — light grayscale */
            --ink: #21262F;        /* Lv1 primary text   */
            --ink-2: #5A6270;      /* Lv2 secondary text */
            --ink-3: #646C7A;      /* Lv3 tertiary text  */
            --line: #B9C0CB;       /* Lv4 borders        */
            --bg: #FEFEFE;
            --glow: rgba(246, 146, 26, 0.09);
            --grid: rgba(33, 38, 47, 0.06);
            /* Shape & type */
            --radius-md: 12px;
            --font-thai: 'IBM Plex Sans Thai';
            --font-en: 'Inter';
            --stack: var(--font-en), var(--font-thai), 'Segoe UI', Tahoma, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --ink: #EAEEEF;    /* Lv1 dark */
                --ink-2: #A0A8B6;  /* Lv2 dark */
                --ink-3: #949CAA;  /* Lv3 dark */
                --line: #343B46;   /* Lv4 dark */
                --bg: #21262F;     /* Lv6 dark background */
                --glow: rgba(246, 146, 26, 0.12);
                --grid: rgba(234, 238, 239, 0.045);
            }
        }
        html, body { height: 100%; }
        body {
            font-family: var(--stack);
            color: var(--ink);
            background-color: var(--bg);
            background-image:
                radial-gradient(640px 340px at 50% -120px, var(--glow), transparent 70%),
                radial-gradient(var(--grid) 1px, transparent 1px);
            background-size: auto, 24px 24px;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }
        /* Thin brand rule along the top edge — the accent, used once, sharply. */
        .brand-rule {
            height: 3px;
            flex: none;
            background: linear-gradient(90deg, transparent, var(--brand) 18%, var(--brand) 82%, transparent);
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }
        .mark img { display: block; width: 96px; height: auto; }
        h1 {
            margin-top: 1.4rem;
            font-family: var(--font-thai), var(--font-en), sans-serif;
            font-size: clamp(1.7rem, 6vw, 2.05rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }
        p { color: var(--ink-2); font-size: 1rem; line-height: 1.65; }
        #message { margin-top: 0.9rem; }
        .open-btn {
            display: none;
            margin: 1.75rem auto 0;
            padding: 0.95rem 2.4rem;
            min-height: 48px;
            border: 0;
            border-radius: var(--radius-md);
            background: var(--brand);
            color: var(--on-brand);
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 120ms ease, transform 120ms ease;
        }
        .open-btn:hover { background: var(--brand-press); }
        .open-btn:active { background: var(--brand-press); transform: translateY(1px); }
        .open-btn:focus-visible { outline: 2px solid var(--brand-link); outline-offset: 3px; }
        .hint {
            font-size: 0.85rem;
            color: var(--ink-3);
            margin-top: 1.4rem;
            padding-top: 1.1rem;
            border-top: 1px solid var(--line);
        }
        footer {
            flex: none;
            text-align: center;
            padding: 1.4rem 1.5rem 1.6rem;
            font-size: 0.8rem;
            color: var(--ink-3);
        }
        footer .dot { color: var(--brand); }
        /* Staggered page-load reveal; the mark then levitates gently. */
        .reveal {
            opacity: 0;
            transform: translateY(14px);
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: var(--d, 0s);
        }
        @keyframes rise { to { opacity: 1; transform: translateY(0); } }
        .mark img { animation: float 5.5s ease-in-out 1s infinite alternate; }
        @keyframes float { from { transform: translateY(0); } to { transform: translateY(-7px); } }
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none; opacity: 1; transform: none; }
            .mark img { animation: none; }
        }
    </style>
</head>
<body>
    <div class="brand-rule" aria-hidden="true"></div>
    <main>
        <div class="mark reveal" aria-hidden="true">
            <img src="/images/logo.png" alt="" width="400" height="400">
        </div>
        <h1 class="reveal" style="--d: 0.08s">GenieGenerate</h1>
        <p id="message" class="reveal" style="--d: 0.16s">ชุมชนร้านค้าและกระเป๋าเงินดิจิทัลของคุณ<br>Your shops &amp; digital wallet community.</p>
        <button id="openApp" class="open-btn reveal" style="--d: 0.24s" type="button">เปิดในแอป GenieGenerate</button>
        <p id="hint" class="hint" hidden>
            ถ้าแอปไม่เปิดขึ้นมา แสดงว่ายังไม่ได้ติดตั้งแอป GenieGenerate บนเครื่องนี้<br>
            If the app didn't open, GenieGenerate isn't installed on this device yet.
        </p>
    </main>
    <footer>
        <span class="dot" aria-hidden="true">●</span>&nbsp; geniegenerate.com
    </footer>
    <script>
        (function () {
            'use strict';
            var path = window.location.pathname;
            var search = window.location.search;
            // Path families the app can route. Anything else stays a plain
            // landing page (never mint a scheme URL from arbitrary input).
            // Path-parameterized families mint the TRIPLE-slash shape
            // (scheme:///shop/x — empty authority) so the Flutter engine
            // hands the app a clean /shop/x path on cold start; the
            // double-slash shape makes it swallow the first segment as the
            // URI authority. Enum routes mint the host form (scheme://login)
            // the app maps by authority.
            var PATH_PARAM = [
                /^\/shop\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i,
                /^\/v\/[0-9a-f]{32}$/
            ];
            var HOST_FORM = [
                /^\/verify-email$/,
                /^\/reset-password$/,
                /^\/login$/
            ];
            var test = function (re) { return re.test(path); };
            var appUrl;
            if (PATH_PARAM.some(test)) {
                appUrl = 'com.geniegenerate.mobile://' + path + search;
            } else if (HOST_FORM.some(test)) {
                appUrl = 'com.geniegenerate.mobile://' + path.slice(1) + search;
            } else {
                return;
            }
            var btn = document.getElementById('openApp');
            var msg = document.getElementById('message');
            var hint = document.getElementById('hint');

            msg.innerHTML = 'ลิงก์นี้เปิดในแอป GenieGenerate<br>This link opens in the GenieGenerate app.';
            btn.style.display = 'inline-block';
            btn.addEventListener('click', function () {
                hint.hidden = false;
                window.location.href = appUrl;
            });

            // Auto-attempt once: installed → OS prompts/opens the app;
            // not installed → silent no-op and the button/hint remain.
            setTimeout(function () {
                hint.hidden = false;
                window.location.href = appUrl;
            }, 600);
        })();
    </script>
</body>
</html>
