<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenieGenerate</title>
    <!--
        Universal-link fallback landing page for link/staginglink/devlink
        .geniegenerate.com. Every path rewrites here (see _redirects).

        Why it exists: in-app browsers (LINE, Messenger, Instagram) load
        tapped links in their own webview and NEVER trigger iOS Universal
        Links / Android App Links. This page is what those users see, so it
        re-launches the app through the custom scheme
        (com.geniegenerate.mobile://...), which webviews DO hand off to the
        OS. The scheme URL is minted from the current path with one rule —
        strip the leading slash — which yields the host-form the app parses
        for enum routes (verify-email, reset-password, login) and the
        authority-folded form ShopShareLink / SlipVerificationLink accept
        for /shop/<uuid> and /v/<token>.
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --brand: #F6921A;
            --brand-dark: #d97b06;
            --ink: #1f2430;
            --ink-soft: #5a6072;
            --card: rgba(255, 255, 255, 0.96);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --ink: #f2f4f8;
                --ink-soft: #b6bcc9;
                --card: rgba(28, 31, 40, 0.96);
            }
        }
        body {
            font-family: 'Inter', 'IBM Plex Sans Thai', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #F6921A 0%, #0FA4A4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 420px;
            margin: 1.5rem;
        }
        .glyph { font-size: 3rem; line-height: 1; }
        h1 {
            margin-top: 0.75rem;
            font-size: 1.6rem;
            color: var(--ink);
            letter-spacing: -0.01em;
        }
        p {
            margin-top: 0.75rem;
            color: var(--ink-soft);
            font-size: 1rem;
            line-height: 1.55;
        }
        .open-btn {
            display: none;
            margin: 1.5rem auto 0;
            padding: 0.95rem 2.2rem;
            min-height: 44px;
            border: 0;
            border-radius: 12px;
            background: var(--brand);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        .open-btn:active { background: var(--brand-dark); }
        .hint { font-size: 0.85rem; margin-top: 1.25rem; }
    </style>
</head>
<body>
    <main class="container">
        <div class="glyph" aria-hidden="true">🧞</div>
        <h1>GenieGenerate</h1>
        <p id="message">ชุมชนร้านค้าและกระเป๋าเงินดิจิทัลของคุณ<br>Your shops &amp; digital wallet community.</p>
        <button id="openApp" class="open-btn" type="button">เปิดในแอป GenieGenerate</button>
        <p id="hint" class="hint" hidden>
            ถ้าแอปไม่เปิดขึ้นมา แสดงว่ายังไม่ได้ติดตั้งแอป GenieGenerate บนเครื่องนี้<br>
            If the app didn't open, GenieGenerate isn't installed on this device yet.
        </p>
    </main>
    <script>
        (function () {
            'use strict';
            var path = window.location.pathname;
            var search = window.location.search;
            // Path families the app can route. Anything else stays a plain
            // landing page (never mint a scheme URL from arbitrary input).
            var DEEP_LINKABLE = [
                /^\/shop\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i,
                /^\/v\/[0-9a-f]{32}$/,
                /^\/verify-email$/,
                /^\/reset-password$/,
                /^\/login$/
            ];
            var linkable = DEEP_LINKABLE.some(function (re) { return re.test(path); });
            if (!linkable) { return; }

            var appUrl = 'com.geniegenerate.mobile://' + path.slice(1) + search;
            var btn = document.getElementById('openApp');
            var msg = document.getElementById('message');
            var hint = document.getElementById('hint');

            msg.innerHTML = 'ลิงก์นี้เปิดในแอป GenieGenerate<br>This link opens in the GenieGenerate app.';
            btn.style.display = 'inline-block';
            btn.addEventListener('click', function () {
                hint.hidden = false;
                window.location.href = appUrl;
            });

            // Auto-attempt once: installed → OS prompts/opens the app;
            // not installed → silent no-op and the button/hint remain.
            setTimeout(function () {
                hint.hidden = false;
                window.location.href = appUrl;
            }, 600);
        })();
    </script>
</body>
</html>
